# Builds the optimized, installable Android release on every push to the
# release branch, on version tags, or on demand (Actions → Android release →
# Run workflow). Outputs (Actions run → Artifacts):
#   ovacome-apks   per-device APKs (arm64 / armeabi-v7a / x86_64) + universal APK
#   ovacome-aab    Play Store bundle (.aab)
#   ovacome-debug  R8 mapping + Dart symbols for de-obfuscating crash reports
#
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   FIREBASE_OPTIONS_DART_B64   base64 of lib/firebase_options.dart (from `flutterfire configure`)
#   ANDROID_KEYSTORE_B64        base64 of your upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON   Play Console service account → auto-upload to the internal track
name: Android release

on:
  workflow_dispatch:
  push:
    branches: [ccr-6096b279-kj6s51, main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Firebase config
        if: env.FIREBASE_OPTIONS_DART_B64 != ''
        run: echo "$FIREBASE_OPTIONS_DART_B64" | base64 -d > lib/firebase_options.dart

      - name: Upload-key signing
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Verify
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build (R8-shrunk, obfuscated, per-ABI)
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/symbols
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-*-release.apk dist/
          cp build/app/outputs/flutter-apk/app-release.apk dist/ovacome-universal.apk
          for f in dist/app-*-release.apk; do mv "$f" "dist/ovacome-$(basename "$f" | sed 's/^app-//; s/-release//')"; done
          cp build/app/outputs/bundle/release/app-release.aab dist/ovacome.aab
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ovacome-apks
          path: dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ovacome-aab
          path: dist/ovacome.aab

      - uses: actions/upload-artifact@v4
        with:
          name: ovacome-debug
          path: |
            build/app/outputs/mapping/release/mapping.txt
            build/symbols

      - name: Upload to Play (internal testing)
        if: env.PLAY_SERVICE_ACCOUNT_JSON != '' && env.ANDROID_KEYSTORE_B64 != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.overcome.overcome
          releaseFiles: dist/ovacome.aab
          track: internal
          status: draft
          mappingFile: build/app/outputs/mapping/release/mapping.txt
