name: overcome
description: Ovacome — self-discovery and digital-addiction recovery, with a secure premium library.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1

  # Firebase backend
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_storage: ^14.0.1
  firebase_analytics: ^13.0.1
  firebase_messaging: ^17.0.1
  firebase_app_check: ^0.5.1

  # Design & motion
  google_fonts: ^9.0.0
  flutter_animate: ^4.5.0
  fl_chart: ^1.3.0

  # Secure library
  pdfx: ^2.8.0
  cryptography: ^2.7.0
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.13
  flutter_tts: ^4.2.0

  # Commerce & security
  in_app_purchase: ^3.2.0
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0

  # Utilities
  intl: ^0.20.3
  shared_preferences: ^2.3.3
  crypto: ^3.0.6
  speech_to_text: ^7.5.0
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  flutter_linkify: ^6.0.0
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

# `dart run flutter_launcher_icons` regenerates the Android/iOS launcher icons.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0A2A2E"
  adaptive_icon_foreground: "assets/icon/android_foreground.png"
  min_sdk_android: 24
